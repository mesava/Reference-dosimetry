name: tests

# Тесты, проверка переводов и сборки, сквозные проверки в браузере — при каждом изменении; сайт (GitHub Pages)
# публикуется только из main и только после того, как всё это прошло: неуспешная сборка или тест на сайт не попадают.
# В настройках репозитория: Settings → Pages → Source: GitHub Actions.
# Версии: действия GitHub — на Node.js 24 (checkout@v6, setup-node@v6, configure-pages@v6, upload-pages-artifact@v5,
# deploy-pages@v5); система сборки закреплена (ubuntu-24.04), чтобы переход ubuntu-latest на новую Ubuntu не сломал
# установку Chromium для сквозных проверок. Обновлять — сознательно, вместе с Playwright.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: у каждой русской строки есть английская пара
        run: npm run i18n:check
      - name: dist/index.html соответствует исходникам
        run: |
          npm run build
          git diff --exit-code -- dist/index.html || (echo "Запустите npm run build и закоммитьте dist/index.html" && exit 1)

  # сквозные проверки в браузере (Chromium): файл журнала, проверка дозиметра, установка как приложение, работа без сети
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # номер версии в адресах всех модулей (с 0.58.1): после выкладки браузер не берёт из кэша старые скрипты
      # вместе с новой страницей; меняется только копия на сервере сборки, не репозиторий
      - name: версия в адресах модулей сайта
        run: node scripts/stamp-site.mjs
      - uses: actions/configure-pages@v6
      # сайт — корень репозитория, как и раньше (index.html, src/, dist/, docs/, значки, манифест, сервис-воркер);
      # скрытые файлы (.git, .github) в архив сайта не попадают
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # GitHub не сразу показывает только что загруженный архив сайта: deploy-pages, запущенный через полсекунды
      # после загрузки, иногда получает «No artifacts named github-pages» (24–25.11.2026 — несколько раз).
      # Поэтому ждём 20 с, а при неудаче через минуту пробуем ещё раз.
      - name: подождать, пока архив сайта появится в списке артефактов
        run: sleep 20
      - id: deployment_try
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: пауза перед повторной выкладкой
        if: steps.deployment_try.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment_try.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        name: адрес выложенного сайта
        run: echo "page_url=${{ steps.deployment_try.outputs.page_url || steps.deployment_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
